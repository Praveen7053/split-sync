plugins {
    id 'java-library'
}

group = 'com.splitsync'
version = '0.1.0-SNAPSHOT'

// Java 17 keeps this module usable by Android (17) and backend (21).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
}
